name: tests

# Offline test gate. Added 2026-08-03: this repo had no CI for its Python
# suite, which is how a stale test and an unsynced env both sat undetected --
# and how the sibling cfbfastR-cfb-data was the ONLY repo to notice when a
# layout change broke test collection. These tests touch no network.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sparse: this repo carries a large committed data tree under nba/
          # and a full checkout is slow to useless here. Code paths only --
          # R/ MUST be included: tests/test_r_python_parity.py enumerates the
          # numbered R stages, and omitting it makes _r_stages() return {} and
          # reds the gate (the exact failure this list previously caused).
          sparse-checkout: |
            python
            tests
            scripts
            R
            pyproject.toml
            uv.lock
          sparse-checkout-cone-mode: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-dependency-glob: uv.lock

      - name: Install
        # --frozen: a PR must not silently re-resolve the lockfile.
        run: uv sync --frozen --dev

      - name: Tests
        # --no-sync: `uv run` would otherwise re-sync and undo the --frozen
        # install above. `archive` tests read the committed nba/ tree, which
        # isn't checked out here.
        run: uv run --no-sync pytest -q -m "not archive"

      - name: Lint
        run: uv run --no-sync ruff check python tests

      - name: Shell syntax
        # scripts/ is bash-only by convention; the scrape/build entry points are
        # not otherwise exercised by CI.
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
